name: SEO Agent

on:
  workflow_dispatch:
  schedule:
    # 4×/day (2026-07-31). Was 2×/day since 2026-07-28, when the ai-fix queue
    # sat at ~22 with 0 PRs shipped for 3 days because Roadie's Claude calls
    # were dying instantly on an exhausted subscription. That condition has
    # since cleared (0 open PRs, 0 eligible ai-fix backlog, no capacity-stall
    # signal since #5126/#5142/#5144 all shipped within hours) — but the 2×/day
    # cadence then ran the seo-proposal bank dry 3 runs straight (2026-07-29
    # 19:28 UTC → 0 fresh; 07-30 07:56 → 1; 07-30 19:34 → 1), starving Roadie's
    # spare capacity of ideas instead. Restoring a conservative middle step
    # between the old 12×/day and the throttled 2×/day (see #5146). Watch
    # backlog/bank over the next few days; drop back to 2×/day if Roadie starts
    # stalling again (the precedent this comment replaces).
    #   summer UTC 1,7,13,19 = Lisbon 02:00 / 08:00 / 14:00 / 20:00.
    - cron: '0 1,7,13,19 * * *'

permissions:
  contents: write
  issues: write
  pull-requests: write

# Never run two SEO instances in parallel — avoids races on seo-plan.md
concurrency:
  group: seo-agent
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install project deps
        run: npm ci --no-audit --no-fund

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Write service-account credentials
        env:
          GA_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p "$RUNNER_TEMP/gcp"
          printf '%s' "$GA_JSON" > "$RUNNER_TEMP/gcp/metrics.json"
          chmod 600 "$RUNNER_TEMP/gcp/metrics.json"

      - name: Configure git author
        # Use Ricardo's identity so Vercel's Git Authorization recognises the
        # committer and doesn't block previews. Agent identity is preserved in
        # the commit message prefix (`seo:`) and via run logs / artifacts.
        run: |
          git config user.name "Ricardo Parro"
          git config user.email "ricardo.parro@gmail.com"

      - name: Fetch fresh GA4 + GSC metrics
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp/metrics.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
        run: node .agents/scripts/fetch-metrics.cjs

      - name: Run SEO agent via Claude Code CLI
        env:
          # Subscription auth (Pro/Max) instead of pay-per-use API billing.
          # CLI uses the OAuth token when ANTHROPIC_API_KEY is absent.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 2nd subscription — run-claude.sh fails over to it when the primary
          # hits its session/usage limit, so a maxed-out plan doesn't kill the run.
          CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          # Sonnet (2026-07-28): proposal generation is mechanical rule-following
          # (bank-cap check, GSC-gap scan) — Sonnet is a good fit and cheaper/
          # faster than the CLI default. See docs/loops.md token-budget note.
          CLAUDE_MODEL: claude-sonnet-5
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp/metrics.json
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE: ${{ secrets.GSC_SITE }}
        run: |
          cat .agents/seo/PROMPT.md | bash .agents/scripts/run-claude.sh

      - name: Commit state changes from this run
        if: always()
        run: |
          git add .agents/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "seo: autonomous run state update [skip ci]"
          fi
          git fetch origin main --quiet
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            for attempt in 1 2 3 4; do
              if git push origin main; then
                echo "Push succeeded on attempt $attempt"
                break
              fi
              echo "Push attempt $attempt failed; sleeping $((attempt * 2))s and retrying"
              sleep $((attempt * 2))
              git pull --rebase origin main || true
            done
          else
            echo "No SEO state changes to commit or push."
          fi

      - name: Upload run log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-agent-run-${{ github.run_id }}
          path: .agents/seo/run.log
          retention-days: 30
          if-no-files-found: ignore
